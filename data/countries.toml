# Pays, gares et lignes.
#
# Les positions sont géographiques : `coord`, `via` et `label` sont des paires
# [longitude, latitude] en degrés (est et nord positifs). Le jeu les projette
# sur le fond de carte (data/world.txt). `length_km` fixe la distance de jeu.
#
# Pays :
#   gauge_mm         écartement des voies ; s'il diffère de celui du pays de départ,
#                    il faut la recherche d'écartement variable pour s'y installer
#   build_cost       multiplicateur du coût de construction (relief)
#   era              époque à partir de laquelle la concession est proposée
#   concession_cost  prix de la concession
#   demand           multiplicateur de demande par catégorie de trafic
#   iso              code du pays dans le fond de carte (ADM0_A3 de Natural Earth),
#                    pour colorer son territoire
#   label            où écrire le nom du pays (par défaut : au-dessus de sa capitale)
# La première gare d'un pays est sa capitale : un nouveau réseau y commence.
#
# Gare : `population` est un poids relatif de la ville, pas un recensement.
# Ligne : `era` est l'époque à partir de laquelle elle peut être construite.
#   Une ligne déclarée dans un pays peut aboutir dans un autre (ligne internationale).

