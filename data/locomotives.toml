fr = "Ce train n'existe pas. L'idée, elle, est ancienne : faire circuler des capsules dans un tube dont on a retiré presque tout l'air, pour supprimer la résistance aérodynamique. Robert Goddard en esquisse le principe dès les années 1900 ; des projets en reprennent l'idée au XXIe siècle sans qu'aucune ligne commerciale n'ait vu le jour. Les chiffres donnés ici sont des ordres de grandeur de projets, pas des mesures."
en = "This train does not exist. The idea of capsules in a near-vacuum tube dates back to the 1900s; no commercial line has ever been built. Figures are project estimates."
