# Locomotives et rames.
#
# era              époque à partir de laquelle la machine est disponible
# requires         recherches nécessaires à l'achat
# requires_upgrade amélioration de ligne indispensable (caténaire, voie maglev…)
# traction         steam | diesel | electric | maglev | vactrain
# top_speed_kmh    vitesse maximale en service
# record_kmh       record de vitesse, pour la fiche (facultatif)
# power_kw         puissance : avec la masse, elle fixe l'accélération
# weight_t         masse à vide ; chaque place occupée ajoute du poids
# fuel, fuel_per_km  énergie consommée, dans l'unité de fuels.toml
# upkeep_per_h     entretien par heure de marche (prix de la première époque)
# track_wear       agressivité pour la voie
# speculative      vrai pour un concept qui n'a jamais existé

