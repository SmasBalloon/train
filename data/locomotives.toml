[[locomotive]]
id            = "rocket"
name          = "Rocket"
builder       = "Robert Stephenson & Co."
year          = 1829
era           = "pioneers"
traction      = "steam"
wheels        = "0-2-2"
top_speed_kmh = 48.0
power_kw      = 15.0
weight_t      = 4.3
capacity      = 30
cost          = 1500.0
upkeep_per_h  = 3.0
fuel          = "coal"
fuel_per_km   = 0.010
track_wear    = 1.3
requires      = ["multitubular_boiler"]
[locomotive.history]
fr = "Vainqueur du concours de Rainhill en octobre 1829, la Rocket atteint environ 48 km/h. Sa chaudière multitubulaire et son échappement dans la cheminée fixent l'architecture de presque toutes les locomotives à vapeur qui suivront. Légère et rapide, elle emporte moins qu'une machine lourde."
en = "Winner of the Rainhill Trials in October 1829, Rocket reached about 30 mph. Its multitubular boiler and blastpipe set the template for nearly every steam locomotive that followed."

[[locomotive]]
id            = "crampton"
name          = "Crampton"
builder       = "Cail, d'après Thomas Crampton"
year          = 1849
era           = "steam"
traction      = "steam"
wheels        = "4-2-0"
top_speed_kmh = 120.0
record_kmh    = 144.0
power_kw      = 300.0
weight_t      = 29.0
capacity      = 110
cost          = 14000.0
upkeep_per_h  = 12.0
fuel          = "coal"
fuel_per_km   = 0.011
track_wear    = 1.6
[locomotive.history]
fr = "Brevetée en 1843 par l'ingénieur anglais Thomas Russell Crampton, cette machine place son unique essieu moteur, aux roues de plus de deux mètres, derrière le foyer : le centre de gravité est bas et la tenue de voie excellente. Boudée en Angleterre, elle fait la gloire des express français du Nord et de l'Est, à 120 km/h, au point que « prendre le Crampton » voulait dire prendre le rapide. Une Crampton modifiée atteint 144 km/h aux essais en 1890. Un seul essieu moteur : elle est rapide, mais ne tire que des trains légers."
en = "Patented in 1843 by Thomas Russell Crampton, with a single huge driving axle behind the firebox. A star of French expresses at 120 km/h, but only with light trains."

[[locomotive]]
id            = "pacific_po_4500"
name          = "Pacific 4500 du Paris-Orléans"
builder       = "SACM, Belfort"
year          = 1907
era           = "steam"
traction      = "steam"
wheels        = "4-6-2"
top_speed_kmh = 120.0
power_kw      = 1300.0
weight_t      = 91.0
capacity      = 340
cost          = 48000.0
upkeep_per_h  = 30.0
fuel          = "coal"
fuel_per_km   = 0.020
track_wear    = 2.4
requires      = ["compound_engine"]
[locomotive.history]
fr = "Livrées à partir de 1907 à la Compagnie du Paris-Orléans, les 4500 sont les premières Pacific d'Europe : un bogie avant, trois essieux moteurs et un essieu porteur sous un grand foyer. Machines compound à quatre cylindres, elles emmènent des trains lourds à 120 km/h. Reconstruites par André Chapelon à partir de 1929, elles doubleront presque leur puissance. Lourde, elle emporte beaucoup mais accélère lentement et fatigue la voie."
en = "Delivered from 1907 to the Paris-Orléans company, the first Pacifics in Europe: four-cylinder compounds hauling heavy trains at 120 km/h."

[[locomotive]]
id            = "mallard"
name          = "A4 Mallard"
builder       = "LNER, Doncaster"
year          = 1938
era           = "apogee"
traction      = "steam"
wheels        = "4-6-2"
top_speed_kmh = 145.0
record_kmh    = 202.6
power_kw      = 1900.0
weight_t      = 104.6
capacity      = 420
cost          = 150000.0
upkeep_per_h  = 60.0
fuel          = "coal"
fuel_per_km   = 0.019
track_wear    = 2.2
requires      = ["kylchap_exhaust", "streamlining"]
[locomotive.history]
fr = "Dessinée par Sir Nigel Gresley pour le London & North Eastern Railway, la n° 4468 Mallard sort des ateliers de Doncaster en mars 1938. Carénage en coin étudié en soufflerie, trois cylindres, double échappement Kylchap. Le 3 juillet 1938, en descendant Stoke Bank avec sept voitures, elle atteint 126 mph, soit 202,6 km/h : le record du monde de vitesse d'une locomotive à vapeur, qui tient toujours. Elle en revient avec une tête de bielle surchauffée."
en = "Designed by Sir Nigel Gresley for the LNER. On 3 July 1938 on Stoke Bank she reached 126 mph, the still-standing world speed record for steam."

