[locomotive.history]
fr = "Construite à Newcastle par George et Robert Stephenson, elle tracte le 27 septembre 1825 le train inaugural du Stockton & Darlington Railway, première ligne publique à utiliser la traction à vapeur. Lente mais robuste, elle tire ce jour-là des wagons de charbon et plusieurs centaines de passagers."
