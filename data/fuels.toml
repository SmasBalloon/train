# Énergies. Les prix sont ceux de la première époque ; ils suivent ensuite
# le `cost_mult` de l'époque en cours.
#
# stock       vrai : s'achète d'avance et se stocke ; faux : payé à la consommation
# volatility  amplitude des variations du cours (0.3 = ±30 %)
# lot         quantité achetée d'un coup dans la fenêtre des combustibles

[[fuel]]
