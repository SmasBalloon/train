# Arbre de recherche.
#
# branch : traction | running_gear | braking | signalling | comfort
# era    : époque à partir de laquelle la recherche est accessible
# requires : recherches préalables
# effects :
#   multiplicateurs  speed_mult, capacity_mult, fare_mult, demand_mult,
#                    track_wear_mult, fuel_mult, weight_mult
#   comfort          bonus ajouté au confort (0 à 1)
#   brake_add        décélération de freinage ajoutée, en m/s²
#   signal_speed     vitesse maximale autorisée par la signalisation, en km/h
#   line_capacity    trains supplémentaires admis sur chaque ligne
#   auto_dispatch    départs automatiques (sans valeur)
#   variable_gauge   accès aux pays d'un autre écartement (sans valeur)
#   no_water_stop    plus d'arrêt pour faire de l'eau (sans valeur)

# ───────────────────────── Pionniers (1825–1850) ─────────────────────────

[[research]]
id = "hand_signals"
branch = "signalling"
era = "pioneers"
year = 1830
cost = 500.0
duration_h = 4.0
effects = [{ kind = "auto_dispatch" }, { kind = "signal_speed", value = 60.0 }]
name = { fr = "Signaleurs de voie", en = "Railway policemen" }
description = { fr = "Des agents postés le long de la ligne donnent le départ par signaux à bras et drapeaux, en laissant un intervalle de temps entre deux trains. Les trains partent seuls à l'heure prévue, ou dès qu'ils sont pleins." }

[[research]]
id = "multitubular_boiler"
branch = "traction"
era = "pioneers"
year = 1829
cost = 600.0
duration_h = 6.0
name = { fr = "Chaudière multitubulaire", en = "Multitubular boiler" }
description = { fr = "Des dizaines de tubes traversent la chaudière et multiplient la surface de chauffe : la vapeur est produite bien plus vite. Idée de Marc Seguin en France et d'Henry Booth en Angleterre, elle ouvre la voie à la Rocket." }

[[research]]
id = "covered_carriages"
branch = "comfort"
era = "pioneers"
year = 1830
cost = 900.0
duration_h = 8.0
effects = [{ kind = "fare_mult", value = 1.20 }, { kind = "demand_mult", value = 1.15 }, { kind = "comfort", value = 0.25 }, { kind = "weight_mult", value = 1.10 }]
name = { fr = "Voitures fermées", en = "Covered carriages" }
description = { fr = "Des voitures inspirées des diligences, avec toit et banquettes, remplacent les wagons découverts. Les voyageurs paient plus cher et viennent plus nombreux, mais les trains s'alourdissent et démarrent moins vite." }

[[research]]
id = "hand_brakes"
branch = "braking"
era = "pioneers"
year = 1835
cost = 1500.0
duration_h = 3.0
effects = [{ kind = "brake_add", value = 0.08 }]
name = { fr = "Serre-freins", en = "Brakesmen" }
description = { fr = "Un agent par voiture serre un frein à vis au coup de sifflet du mécanicien. C'est lent et inégal, mais le train s'arrête plus court, donc peut rouler plus longtemps à pleine vitesse." }

[[research]]
id = "wrought_iron_rails"
branch = "running_gear"
era = "pioneers"
year = 1832
cost = 3000.0
duration_h = 6.0
effects = [{ kind = "track_wear_mult", value = 0.80 }]
name = { fr = "Rails en fer laminé", en = "Wrought iron rails" }
description = { fr = "Les rails en fer laminé, plus longs et moins cassants que la fonte, tiennent bien mieux sous le poids des machines." }

[[research]]
id = "electric_telegraph"
branch = "signalling"
era = "pioneers"
year = 1837
cost = 8000.0
duration_h = 8.0
requires = ["hand_signals"]
effects = [{ kind = "signal_speed", value = 100.0 }, { kind = "line_capacity", value = 1 }]
name = { fr = "Télégraphe électrique", en = "Electric telegraph" }
description = { fr = "Le télégraphe de Cooke et Wheatstone, installé le long des voies dès 1837, permet à une gare de savoir que la voie est libre avant d'y engager un train. On peut faire rouler plus de trains, plus vite." }

[[research]]
id = "variable_expansion"
branch = "traction"
era = "pioneers"
year = 1842
cost = 12000.0
duration_h = 8.0
requires = ["multitubular_boiler"]
effects = [{ kind = "fuel_mult", value = 0.85 }]
name = { fr = "Distribution à détente variable", en = "Variable expansion valve gear" }
description = { fr = "La coulisse de Stephenson permet de régler l'admission de vapeur en marche et de la laisser se détendre dans le cylindre : la même vapeur travaille plus, on brûle moins de charbon." }

# ───────────────────── Âge d'or de la vapeur (1850–1930) ─────────────────────

[[research]]
id = "bessemer_steel"
branch = "running_gear"
era = "steam"
year = 1857
cost = 180000.0
duration_h = 8.0
requires = ["wrought_iron_rails"]
name = { fr = "Acier Bessemer", en = "Bessemer steel" }
description = { fr = "Le convertisseur de Henry Bessemer (1856) produit de l'acier en masse. Un rail en acier dure plusieurs fois plus longtemps qu'un rail en fer. Débloque l'amélioration « Rails en acier »." }

[[research]]
