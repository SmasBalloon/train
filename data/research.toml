[[research]]
id = "heating_lighting"
branch = "comfort"
era = "steam"
year = 1890
cost = 210000.0
duration_h = 8.0
effects = [{ kind = "comfort", value = 0.10 }, { kind = "demand_mult", value = 1.10 }]
