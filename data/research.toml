name = { fr = "Voitures à bogies", en = "Bogie carriages" }
description = { fr = "Au lieu d'essieux fixés à la caisse, deux chariots pivotants guident la voiture dans les courbes. Les voitures peuvent s'allonger, roulent plus doux et ménagent la voie." }

[[research]]
id = "air_brake"
branch = "braking"
era = "steam"
year = 1869
cost = 240000.0
duration_h = 10.0
requires = ["hand_brakes"]
effects = [{ kind = "brake_add", value = 0.25 }]
name = { fr = "Frein à air comprimé", en = "Air brake" }
description = { fr = "Le frein de George Westinghouse (1869) est commandé par le mécanicien sur tout le train à la fois, et se serre de lui-même si le train se coupe. Freiner court permet de rouler vite plus longtemps." }

[[research]]
id = "semaphore_block"
branch = "signalling"
era = "steam"
year = 1856
cost = 300000.0
duration_h = 12.0
requires = ["electric_telegraph"]
