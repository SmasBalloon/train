name = { fr = "Voitures-lits", en = "Sleeping cars" }
description = { fr = "George Pullman aux États-Unis, puis Georges Nagelmackers en Europe, transforment la voiture en hôtel roulant. Un lit prend la place de plusieurs sièges : moins de places, des trains plus lourds, mais des billets bien plus chers." }

[[research]]
id = "dining_cars"
branch = "comfort"
