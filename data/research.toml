description = { fr = "La ligne est découpée en cantons : un seul train par canton, protégé par un sémaphore. Avec les enclenchements, qui interdisent les manœuvres contradictoires, c'est la base de la sécurité ferroviaire." }

[[research]]
id = "compound_engine"
branch = "traction"
era = "steam"
year = 1876
cost = 360000.0
duration_h = 12.0
requires = ["variable_expansion"]
effects = [{ kind = "fuel_mult", value = 0.85 }]
name = { fr = "Machine compound", en = "Compound engine" }
description = { fr = "La vapeur travaille deux fois : d'abord dans des cylindres à haute pression, puis dans des cylindres à basse pression. Anatole Mallet l'applique aux locomotives en 1876, Alfred de Glehn en tire les grandes machines d'express françaises." }

[[research]]
id = "water_troughs"
branch = "traction"
era = "steam"
year = 1860
cost = 210000.0
duration_h = 8.0
effects = [{ kind = "no_water_stop" }]
name = { fr = "Prise d'eau en marche", en = "Water troughs" }
description = { fr = "Une rigole pleine d'eau entre les rails, une écope sous le tender : la machine fait le plein sans s'arrêter. Inventée par John Ramsbottom en 1860. Les trains à vapeur n'ont plus à attendre en gare pour faire de l'eau." }

[[research]]
id = "superheater"
branch = "traction"
era = "steam"
year = 1898
cost = 540000.0
duration_h = 14.0
requires = ["compound_engine"]
