# Équipages : conducteurs et contrôleurs affectés aux trains.
#
# Un train ne part pas sans un conducteur recruté et affecté ; sans contrôleur
# désigné, il roule avec du personnel ordinaire, sans bonus. La prime du tout
# premier conducteur est offerte.
# Chaque compétence va de 0 à 1 (affichée sur cinq étoiles) et progresse avec
# les kilomètres parcourus.

candidates_per_day = 4      # candidats proposés chaque jour de jeu (moitié de chaque métier)
base_wage          = 3.0    # salaire horaire d'un débutant, première époque
skill_wage         = 9.0    # supplément horaire pour un équipier parfait
hire_fee_hours     = 24.0   # prime d'embauche, en heures de salaire
xp_per_km          = 0.00002  # part du chemin vers la perfection gagnée par km parcouru

# Formations : on programme une session (un métier, une compétence), puis on y
# inscrit des équipiers. Ils sont absents pendant la session : un conducteur en
# formation laisse son train à quai. Prix par inscrit (première époque) :
# training_cost × (1 + training_cost_growth × niveau²).
training_gain         = 0.10   # progression dans la compétence travaillée
training_cost         = 60.0
training_cost_growth  = 6.0
training_seats        = 5      # inscrits au plus par session
training_fail_chance  = 0.10   # risque de ne rien retenir
training_delay_h      = 6.0    # délai entre la programmation et le début, en heures de jeu
training_duration_h   = 8.0    # durée d'une session, en heures de jeu

# Effet d'une compétence au maximum (un équipier à moitié compétent en donne la moitié).
[effects]
driving_accel   = 0.30   # conduite : accélération et freinage, donc temps de parcours
economy_fuel    = 0.15   # économie : consommation en moins
care_wear       = 0.30   # douceur : usure de la voie en moins
service_comfort = 0.15   # accueil : confort ressenti par les voyageurs
control_revenue = 0.10   # contrôle : recettes en plus (moins de fraude)
boarding_speed  = 0.50   # embarquement : montée des voyageurs plus rapide

