# Catégories de trafic : voyageurs et fret.
#
# share              part de la demande de base d'une gare
# fare_mult          multiplicateur du tarif de base
# elasticity         sensibilité au prix : demande × prix^(-elasticity)
# *_weight           ce qui compte pour la satisfaction (pondérations relatives)
# hourly             multiplicateur de demande pour chacune des 24 heures (0 h à 23 h)

