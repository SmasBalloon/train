name: Release

# Lancement manuel : onglet Actions → Release → « Run workflow ».
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.2.0). Laisser vide pour la détecter depuis les commits."
        type: string
        required: false
        default: ""
      bump:
        description: "Si version vide : auto = d'après les commits (feat → mineure, fix → patch, ! ou BREAKING CHANGE → majeure)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Essai à blanc : tout compiler et afficher le patch note, sans tag ni release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Version et patch note
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - name: Uniquement depuis master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Les releases se lancent depuis master (ici : ${{ github.ref_name }})."
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: prep
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          NOTES_FILE: release-notes.md
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash .github/scripts/release-prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml

  build:
    needs: [prepare, checks]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publier ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          mv release-notes.md ../
          sha256sum rail-* > SHA256SUMS.txt
          ls -l

      # Le dépôt sert aussi de tap Homebrew (Formula/) et de bucket Scoop (bucket/).
      - name: Formule Homebrew et manifeste Scoop
        run: |
          bash .github/scripts/package-manifests.sh "$TAG" . dist/SHA256SUMS.txt
          ruby -c Formula/rainhill.rb
          python3 -m json.tool bucket/rainhill.json > /dev/null

      - name: Commit de version et tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/set-version.sh "$VERSION"
          git add Cargo.toml Cargo.lock Formula/rainhill.rb bucket/rainhill.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG"
          fi
          git tag -a "$TAG" -m "$TAG"
          # --atomic : si master a bougé depuis le lancement, rien n'est poussé.
          git push --atomic origin "HEAD:refs/heads/master" "refs/tags/$TAG"

      - name: Release GitHub
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag

  # Publie la nouvelle version sur crates.io (cargo install rainhill), par
  # « Trusted Publishing » : crates.io vérifie que la demande vient bien de ce
  # workflow et délivre un jeton éphémère. Aucun secret à stocker.
  # À configurer une fois sur crates.io : rainhill → Settings → Trusted Publishing
  # (dépôt SmasBalloon/train, workflow release.yml).
  crates:
    name: Publier sur crates.io
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Version déjà publiée ?
        id: check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "User-Agent: rainhill-release (github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/rainhill/$VERSION")
          if [ "$code" = 200 ]; then
            echo "rainhill $VERSION est déjà sur crates.io : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.publish == 'true'

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.publish == 'true'
        id: auth

      - name: cargo publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          grep -q "^version = \"$VERSION\"" Cargo.toml \
            || { echo "::error::Cargo.toml n'est pas en $VERSION"; exit 1; }
          cargo publish --locked
          echo "### rainhill $VERSION publié : https://crates.io/crates/rainhill" >> "$GITHUB_STEP_SUMMARY"

  # Met à jour le paquet AUR rainhill-bin (yay -S rainhill-bin) avec la nouvelle release.
  aur:
    needs: [prepare, publish]
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # Vérifie que la formule Homebrew et le manifeste Scoop, publiés avec le commit
  # de version, s'installent bien sur macOS et Windows.
  packages:
    needs: [prepare, publish]
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
