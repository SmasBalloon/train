name: AUR

# Publie le paquet rainhill-bin sur l'AUR pour une release GitHub déjà publiée.
# - Appelé par release.yml juste après la publication.
# - Lançable à la main (Actions → AUR → Run workflow) pour une release existante,
#   ou pour republier la même version avec un PKGBUILD corrigé (pkgrel + 1).
#
# Prérequis : un compte AUR, et le secret AUR_SSH_PRIVATE_KEY (clé privée dont la
# clé publique est enregistrée sur ce compte). Sans ce secret, le paquet est
# construit et testé, mais pas publié.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      pkgrel:
        type: string
        default: "1"
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release à publier sur l'AUR (ex. v1.0.0)"
        type: string
        required: true
      pkgrel:
        description: "Révision du paquet : 1 pour une nouvelle version, plus pour republier la même"
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  aur:
    name: rainhill-bin ${{ inputs.tag }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ inputs.tag }}
      PKGREL: ${{ inputs.pkgrel }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      # Empreinte publiée sur https://aur.archlinux.org (clé ED25519 du serveur).
      AUR_HOST_FINGERPRINT: "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
    steps:
      - name: Outils
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: PKGBUILD de ${{ inputs.tag }}
        run: bash .github/scripts/aur-pkgbuild.sh "$TAG" "$PKGREL" packaging/aur/rainhill-bin/PKGBUILD

      # makepkg refuse de tourner en root : on construit avec un utilisateur dédié.
      - name: Construire et tester le paquet
        run: |
          useradd --create-home builder
          cp -r packaging/aur/rainhill-bin /home/builder/pkg
          chown -R builder: /home/builder/pkg
          su builder -c '
            set -e
            cd ~/pkg
            makepkg --noconfirm --force
            makepkg --printsrcinfo > .SRCINFO
            mkdir root && tar -xf rainhill-bin-*.pkg.tar.zst -C root
            ./root/usr/bin/rail --version
          '
          cat /home/builder/pkg/.SRCINFO

      - name: Clé AUR absente
        if: env.AUR_KEY == ''
        run: |
          echo "::warning::Secret AUR_SSH_PRIVATE_KEY absent : paquet construit et testé, mais pas publié sur l'AUR."

      - name: Publier sur l'AUR
        if: env.AUR_KEY != ''
        run: |
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$AUR_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # On n'accepte que le serveur dont l'empreinte est publiée par l'AUR.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$ssh_dir/known_hosts" 2>/dev/null
          seen=$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk '{print $2}')
          if [ "$seen" != "$AUR_HOST_FINGERPRINT" ]; then
            echo "::error::Empreinte SSH inattendue pour aur.archlinux.org : $seen"
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"

          git clone ssh://aur@aur.archlinux.org/rainhill-bin.git aur
          cp /home/builder/pkg/PKGBUILD /home/builder/pkg/.SRCINFO aur/
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "L'AUR a déjà ce PKGBUILD : rien à publier."
            exit 0
          fi
          git commit -m "rainhill-bin ${TAG#v}-$PKGREL"
          git push origin HEAD:master
          echo "### rainhill-bin ${TAG#v}-$PKGREL publié : https://aur.archlinux.org/packages/rainhill-bin" >> "$GITHUB_STEP_SUMMARY"
