[package]
name = "rainhill"
version = "1.1.1"
edition = "2024"
description = "Jeu incrémental de réseau ferroviaire dans le terminal, de 1825 à demain"
# Licence maison (non SPDX) : usage et modifications libres, en terminal uniquement.
license-file = "LICENSE"
default-run = "rail"
repository = "https://github.com/SmasBalloon/train"
readme = "README.md"
keywords = ["game", "terminal", "tui", "railway", "incremental"]
categories = ["games", "command-line-utilities"]
# `File::try_lock` (verrou de la sauvegarde) : stable depuis Rust 1.89.
rust-version = "1.89"
# Ce qui ne sert qu'au développement ne part pas dans le paquet.
exclude = [".github/", ".gitattributes", "CONTRIBUTING.md", "docs/", "packaging/", "Formula/", "bucket/", "tools/"]

[lib]
name = "rainhill"
path = "src/lib.rs"

[[bin]]
name = "rail"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = { version = "0.10.1", features = ["getrandom"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip : une partie relue doit être identique au bit près.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
toml = "1.2.1"
